# 网页终端用的 tmux 配置，照 agentbox 的 images/agent/tmux.conf（Apache-2.0）改的：
# tmux 只用来断线续接，尽量隐形，用户看到的就是一个普通终端。只作用于 hub 自己的 tmux socket，
# 不影响你在 SSH 里开的 tmux。

# 没有状态栏、没有前缀键：Ctrl+B 等按键原样交给 claude 之类的 TUI
set -g status off
set -g prefix None
set -g prefix2 None

# 内层 TERM 与真彩
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Esc 不等待；焦点事件透传（claude 会用）
set -s escape-time 10
set -g focus-events on

# 滚轮在 shell 里翻 tmux 历史、在 TUI 里交给程序；按住 Shift 拖动就是浏览器自己的选区
set -g mouse on
set -g history-limit 50000

# 程序直接打印的 OSC52 不转发；Claude Code 复制时用的 `tmux load-buffer -w` 不受影响
set -s set-clipboard off

# 跟 SSH 登录一样起登录 shell（读 ~/.profile，PATH 才齐）
set -g default-command "exec bash -l"
